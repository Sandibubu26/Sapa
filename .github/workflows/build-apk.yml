name: Build SAPA APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Cordova files
        run: |
          ls -la capacitor-cordova-android-plugins
          test -f capacitor-cordova-android-plugins/cordova.variables.gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAPA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
